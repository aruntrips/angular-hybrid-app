<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <title>Task Manager — AngularJS → Angular Hybrid Migration</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!--
    AngularJS is gone (Stage 6) - no CDN script tag. <task-list> is

  -->

  <script src="dist/bundle.js"></script>
