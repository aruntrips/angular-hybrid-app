<!DOCTYPE html>
<html lang="en" ng-app="taskApp">
<head>
  <meta charset="UTF-8" />
  <title>Task Manager — AngularJS → Angular Hybrid Migration</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- AngularJS core, loaded from CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>
<body>
  <div class="app-shell" ng-controller="TaskListController as vm">
    <header>
      <h1>Task Manager</h1>
      <p class="subtitle">AngularJS 1.x sample app — hybrid migration practice ground</p>
    </header>

    <section class="add-task">
      <input
        type="text"
        ng-model="vm.newTaskTitle"
        placeholder="Add a new task..."
        ng-keyup="$event.keyCode === 13 && vm.addTask()"
      />
      <button ng-click="vm.addTask()" ng-disabled="!vm.newTaskTitle">Add</button>
    </section>

    <section class="filters">
      <button
        ng-repeat="f in vm.filters"
        ng-click="vm.setFilter(f)"
        ng-class="{active: vm.currentFilter === f}"
      >
        {{ f }}
      </button>
    </section>

    <section class="task-list">
      <!-- taskItem is an AngularJS .component(), the easiest kind of unit
           to later upgrade/downgrade during hybrid migration -->
      <task-item
        ng-repeat="task in vm.filteredTasks()"
        task="task"
        on-toggle="vm.toggleTask(task)"
        on-remove="vm.removeTask(task)"
      ></task-item>

      <p class="empty-state" ng-if="vm.filteredTasks().length === 0">
        No tasks match this filter.
      </p>
    </section>

    <footer>
      <span>{{ vm.remainingCount() }} remaining</span>
    </footer>
  </div>

  <!-- App module + pieces -->
  <script src="js/app.js"></script>
  <script src="js/services/taskService.js"></script>
  <script src="js/controllers/taskListController.js"></script>
  <script src="js/components/taskItem.component.js"></script>
</body>
</html>
