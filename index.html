<!DOCTYPE html>
<html lang="en">
<!--
  No ng-app here anymore. As of Stage 2, Angular's UpgradeModule
  bootstraps 'taskApp' manually (see src/app.module.ts). Leaving
  ng-app in place alongside that would auto-bootstrap AngularJS a
  second time and throw a "already bootstrapped" error.
-->
<head>
  <meta charset="UTF-8" />
  <title>Task Manager — AngularJS → Angular Hybrid Migration</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- AngularJS core, loaded from CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>
<body>
  <div class="app-shell" ng-controller="TaskListController as vm">
    <header>
      <h1>Task Manager</h1>
      <p class="subtitle">AngularJS 1.x sample app — hybrid migration practice ground</p>
    </header>

    <section class="add-task">
      <input
        type="text"
        ng-model="vm.newTaskTitle"
        placeholder="Add a new task..."
        ng-keyup="$event.keyCode === 13 && vm.addTask()"
      />
      <button ng-click="vm.addTask()" ng-disabled="!vm.newTaskTitle">Add</button>
    </section>

    <section class="filters">
      <button
        ng-repeat="f in vm.filters"
        ng-click="vm.setFilter(f)"
        ng-class="{active: vm.currentFilter === f}"
      >
        {{ f }}
      </button>
    </section>

    <section class="task-list">
      <task-item
        ng-repeat="task in vm.filteredTasks()"
        task="task"
        on-toggle="vm.toggleTask(task)"
        on-remove="vm.removeTask(task)"
      ></task-item>

      <p class="empty-state" ng-if="vm.filteredTasks().length === 0">
        No tasks match this filter.
      </p>
    </section>

    <footer>
      <span>{{ vm.remainingCount() }} remaining</span>
    </footer>
  </div>

  <!-- App module + pieces -->
  <script src="js/app.js"></script>
  <script src="js/controllers/taskListController.js"></script>
  <script src="js/components/taskItem.component.js"></script>

  <!--
    Must load AFTER the scripts above: 'taskApp' needs to already be
    registered with AngularJS before Angular's bootstrapModule() call
    runs and asks UpgradeModule to bootstrap it.
  -->
  <script src="dist/bundle.js"></script>
</body>
</html>
